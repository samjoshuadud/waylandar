[project]
name = "waylandar"
version = "0.1.0"
description = "Wayland calendar widget with multi-provider sync"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "S", "RUF", "SIM", "TRY", "PIE"]
ignore = [
    "BLE001", # Blind exception catching is intentional for provider fallbacks & daemon thread safety
    "E501",   # Line length handled by formatter
    "S110",   # Intentional silent try-except-pass fallbacks
    "S310",   # urllib URL open for fetching ICS calendar feeds
    "SIM105", # Use contextlib.suppress(OSError)
    "SIM108", # Use ternary operator
    "TRY003", # Long exception messages
    "TRY300", # Move return to else block
]
